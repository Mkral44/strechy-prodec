<!doctype html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Střechy Proděc</title>

<link rel="icon" href="logo.jpg">

<style>
html{scroll-behavior:smooth}
body{margin:0;font-family:Arial;background:#f7fbf8;color:#123f4a}

header{position:sticky;top:0;background:white;z-index:100;border-bottom:1px solid #eee}
.nav{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;padding:10px 20px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:#123f4a}
.logo img{width:50px;height:50px;border-radius:50%}

nav a{margin:0 10px;text-decoration:none;font-weight:bold;color:#195f6f}

.hero{height:100vh;background:url('uvod.jpeg') center/cover no-repeat;display:flex;align-items:center;justify-content:center;position:relative;text-align:center;color:white}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.hero-content{position:relative}
.hero h1{font-size:50px}
.btn{background:#195f6f;color:white;padding:15px 25px;border-radius:999px;text-decoration:none;display:inline-block;margin-top:20px}

.services{padding:80px 20px;text-align:center}
.services-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;max-width:1000px;margin:auto}
.service{background:white;padding:25px;border-radius:15px;box-shadow:0 10px 20px rgba(0,0,0,.1)}

.instagram-link{display:flex;align-items:center;gap:10px}
.instagram-icon{width:22px;height:22px}
</style>
</head>

<body>

<header>
  <div class="nav">
    <a href="#uvod" class="logo">
      <img src="logo.jpg">
      <strong>Střechy Proděc</strong>
    </a>

    <nav>
      <a href="#uvod">Úvod</a>
      <a href="#sluzby">Naše služby</a>
      <a href="#kontakt">Kontakt</a>
    </nav>
  </div>
</header>

<section id="uvod" class="hero">
  <div class="overlay"></div>
  <div class="hero-content">
    <h1>Kvalitní střechy bez starostí</h1>
    <p>Ve Znojmě a širokém okolí</p>
    <a href="#kontakt" class="btn">Nezávazná poptávka</a>
  </div>
</section>

<section id="sluzby" class="services">
  <h2>Naše služby</h2>

  <div class="services-grid">
    <div class="service">🪚 Tesařství</div>
    <div class="service">🔨 Klempířství</div>
    <div class="service">🏠 Pokrývačství</div>
    <div class="service">🧱 Izolatérství</div>
  </div>
</section>

<section id="kontakt" class="services">
  <h2>Kontakt</h2>

  <p>📞 601 343 327</p>
  <p>✉ strechyprodec@seznam.cz</p>

  <p>
    <a class="instagram-link" href="https://www.instagram.com/strechy_prodec/" target="_blank">

      <svg class="instagram-icon" viewBox="0 0 24 24">
        <defs>
          <linearGradient id="ig" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#feda75"/>
            <stop offset="25%" stop-color="#fa7e1e"/>
            <stop offset="50%" stop-color="#d62976"/>
            <stop offset="75%" stop-color="#962fbf"/>
            <stop offset="100%" stop-color="#4f5bd5"/>
          </linearGradient>
        </defs>
        <rect x="2" y="2" width="20" height="20" rx="6" fill="url(#ig)"/>
        <circle cx="12" cy="12" r="4" stroke="white" stroke-width="2" fill="none"/>
        <circle cx="17" cy="7" r="1" fill="white"/>
      </svg>

      STŘECHY PRODĚC
    </a>
  </p>

</section>

</body>
</html>
